<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>document.documentElement.classList.add("js")</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    } }
  </script>
  <title>knto.creates</title>
  <meta name="description" content="Free Fusion 360 designs, explained and fabricated with 3D printing and laser cutting." />
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="logo" href="index.html">knto<span class="dot">.</span>creates</a>
      <nav class="nav-links" aria-label="Main">
        <a href="index.html#designs" aria-current="page">Designs</a>
        <a href="about.html">About me</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero wrap">
      <h1 class="big" data-float="-0.25" data-fade><span class="line-mask"><span>knto<span class="dot">.</span>creates</span></span></h1>
      <div data-float="-0.12" data-fade><p class="lede" data-enter style="--i:2">Free Fusion 360 designs, explained and fabricated.</p></div>
    </section>

    <section class="section wrap" id="designs">
      <h2 data-reveal data-float="0.05">Designs</h2>
      <ul class="index" id="index"></ul>
    </section>
  </main>
  <footer>
    <div class="wrap">
      <span>knto.creates</span>
      <span class="links"><a href="#" data-social="instagram">Instagram</a><a href="#" data-social="youtube">YouTube</a></span>
    </div>
  </footer>
  <script type="module" src="js/site.js"></script>
  <script type="module">
    import { DESIGNS } from "./js/designs.js";
    import { renderThumb } from "./js/viewer.js";
    import { reveal } from "./js/site.js";
    const list = document.getElementById("index");
    if (!DESIGNS.length) list.outerHTML = '<p class="lede">Designs coming soon.</p>';
    DESIGNS.forEach((d, i) => {
      const li = document.createElement("li");
      li.className = "row"; li.dataset.reveal = ""; li.dataset.float = (0.03 + (i % 3) * 0.02).toFixed(2); li.style.setProperty("--i", i % 4);
      li.innerHTML = `<a href="design.html?id=${encodeURIComponent(d.id)}">
          <span class="thumb"></span>
          <span><h3></h3><p></p></span>
          <svg class="arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>`;
      li.querySelector("h3").textContent = d.title;
      li.querySelector("p").textContent = d.summary;
      list.append(li);
      const img = new Image(); img.alt = ""; img.style.viewTransitionName = "design-" + d.id;
      li.querySelector(".thumb").append(img);
      (d.thumb ? Promise.resolve(d.thumb) : renderThumb(d)).then((src) => (img.src = src)).catch(() => {});
    });
    reveal(list);
  </script>
</body>
</html>
