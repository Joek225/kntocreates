<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>document.documentElement.classList.add("js")</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=__V__" />
  <script type="importmap">
    { "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    } }
  </script>
  <title>knto.creates</title>
  <meta name="description" content="Free Fusion 360 designs, explained and fabricated with 3D printing and laser cutting." />
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="logo" href="index.html">knto<span class="dot">.</span>creates</a>
      <nav class="nav-links" aria-label="Main">
        <a href="index.html#designs" aria-current="page">Designs</a>
        <a href="about.html">About me</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero wrap">
      <h1 class="big" data-fade><span class="line-mask"><span>knto<span class="dot">.</span>creates</span></span></h1>
      <div data-fade><p class="lede" data-enter style="--i:2">Free Fusion 360 designs, explained and fabricated.</p></div>
    </section>

    <section class="section wrap" id="designs">
      <h2 data-reveal data-float="0.05">Designs</h2>
      <div class="cards" id="cards"></div>
    </section>
  </main>
  <footer>
    <div class="wrap">
      <span>knto.creates</span>
      <span class="links"><a href="#" data-social="instagram">Instagram</a><a href="#" data-social="youtube">YouTube</a></span>
    </div>
  </footer>
  <script type="module" src="js/site.js?v=__V__"></script>
  <script type="module">
    import { DESIGNS } from "./js/designs.js?v=__V__";
    import { renderThumb } from "./js/viewer.js?v=__V__";
    import { reveal } from "./js/site.js?v=__V__";
    const list = document.getElementById("cards");
    const icon = {
      dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
      out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>',
    };
    const fmt = (s) => s ? new Date(s + "T00:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) : "";
    if (!DESIGNS.length) list.outerHTML = '<p class="lede">Designs coming soon.</p>';
    DESIGNS.forEach((d, n) => {
      const url = "design.html?id=" + encodeURIComponent(d.id);
      const files = (d.downloads || []).map((f) => f.label.replace(/ \(.*\)/, "").replace("Fusion 360", "F3D")).join(" · ") || "Coming soon";
      const firstFile = (d.downloads || []).find((f) => f.url);
      const video = [d.instagram && "Reel", d.youtube && "Short"].filter(Boolean).join(" · ") || "Coming soon";
      const card = document.createElement("article");
      card.className = "card"; card.dataset.reveal = ""; card.dataset.float = "0.04"; card.style.setProperty("--i", n % 4);
      card.innerHTML = `
        <header class="card-top">
          <h3><a href="${url}"></a></h3>
          <a class="card-dl" href="${firstFile ? firstFile.url : url}" ${firstFile ? "download" : ""} aria-label="Download">${icon.dl}</a>
        </header>
        <div class="card-band"><span>Design ${String(n + 1).padStart(2, "0")}</span><time datetime="${d.date || ""}">${fmt(d.date)}</time></div>
        <a class="card-preview" href="${url}" tabindex="-1" aria-hidden="true"><span class="thumb"></span></a>
        <p class="card-sum"></p>
        <dl class="card-rows">
          <div><dt>Files</dt><dd>${files}</dd></div>
          <div><dt>Video</dt><dd>${video}</dd></div>
        </dl>
        <div class="card-actions">
          <a class="pill solid" href="${url}">View design</a>
          ${d.instagram ? `<a class="pill" href="${d.instagram}" target="_blank" rel="noopener">Watch the reel ${icon.out}</a>` : `<a class="pill" href="${url}">Spin it in 3D ${icon.out}</a>`}
        </div>`;
      card.querySelector("h3 a").textContent = d.title;
      card.querySelector(".card-sum").textContent = d.summary;
      list.append(card);
      const img = new Image(); img.alt = ""; img.style.viewTransitionName = "design-" + d.id;
      card.querySelector(".thumb").append(img);
      (d.thumb ? Promise.resolve(d.thumb) : renderThumb(d)).then((src) => (img.src = src)).catch(() => {});
    });
    reveal(list);
  </script>
</body>
</html>
