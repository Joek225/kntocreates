<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>document.documentElement.classList.add("js")</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=__V__" />
  <script type="importmap">
    { "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    } }
  </script>
  <title>About me | knto.creates</title>
  <meta name="description" content="Free Fusion 360 designs, explained and fabricated with 3D printing and laser cutting." />
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="logo" href="index.html">knto<span class="dot">.</span>creates</a>
      <nav class="nav-links" aria-label="Main">
        <a href="index.html#designs">Designs</a>
        <a href="about.html" aria-current="page">About me</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="about-hero wrap">
      <figure class="me" data-float="0.06" data-fade>
        <img src="images/joey-lake.jpg" width="723" height="1086" alt="Joey balancing on one leg on a rock at a glacier lake" />
      </figure>
      <div class="about-hero-text" data-float="-0.08" data-fade>
        <h1 class="big">
          <span class="line-mask"><span style="--i:0">Hi, I'm Joey.</span></span>
          <span class="line-mask"><span style="--i:1">I make <span class="accent">things.</span></span></span>
        </h1>
        <a class="scroll-more" href="#vex" data-enter style="--i:4">
          Scroll down to learn more about me
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </a>
      </div>
    </section>

    <section class="vex wrap" id="vex">
      <h2 data-reveal data-float="0.04">VEX Robotics</h2>
      <div class="vex-grid" id="vex-grid">
        <figure class="vex-photo">
          <img src="images/vex-worlds-2025.jpg" width="1642" height="1236" loading="lazy" alt="Team Singapore walking on stage at the VEX Robotics World Championship 2025" />
          <span class="target" style="--x:72.4%; --y:86%"></span>
        </figure>
        <p class="thats-me" id="thats-me">That's me!</p>
        <svg class="pointer" id="pointer" aria-hidden="true"><path id="pointer-path" /><path id="pointer-head" /></svg>
      </div>

      <div class="cad-grid">
        <figure class="cad-video" data-reveal data-float="0.05">
          <video id="cad-video" src="media/robot-slider.mp4" poster="media/robot-slider-poster.jpg" width="1280" height="986" muted playsinline preload="auto" aria-label="Fusion 360 motion study of the robot's pneumatic slider folding out the front flap"></video>
        </figure>
        <figure class="cad-still" data-reveal data-float="0.1" style="--i:1">
          <img src="images/robot-6546c.jpg" width="2000" height="1833" loading="lazy" alt="Fusion 360 render of team 6546C's VEX robot" />
          <figcaption>I'm the designer on my robotics team. I CAD our robot in Fusion 360 and simulate each mechanism, so we know it works before anything gets built.</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <footer>
    <div class="wrap">
      <span>knto.creates</span>
      <span class="links"><a href="#" data-social="instagram">Instagram</a><a href="#" data-social="youtube">YouTube</a></span>
    </div>
  </footer>
  <script type="module" src="js/site.js?v=__V__"></script>
  <script>
    // Animated arrow from "That's me!" to the person in the arm sling
    const grid = document.getElementById("vex-grid"), photo = grid.querySelector(".vex-photo");
    const label = document.getElementById("thats-me"), svg = document.getElementById("pointer");
    const path = document.getElementById("pointer-path"), head = document.getElementById("pointer-head");
    const target = photo.querySelector(".target");
    function drawArrow() {
      // positions come from layout (offsets), so running animations don't throw the arrow off
      svg.setAttribute("viewBox", `0 0 ${grid.clientWidth} ${grid.clientHeight}`);
      const tx = photo.offsetLeft + photo.offsetWidth * 0.724, ty = photo.offsetTop + photo.offsetHeight * 0.86;
      const lx = label.offsetLeft, ly = label.offsetTop, lw = label.offsetWidth, lh = label.offsetHeight;
      const stacked = ly > photo.offsetTop + photo.offsetHeight - 1; // phone: label sits under the photo
      let sx, sy, ex, ey, cx, cy;
      if (stacked) { sx = lx + lw * 0.5; sy = ly - 10; ex = tx + 6; ey = ty + 24; cx = Math.max(sx, ex) + 50; cy = (sy + ey) / 2; }
      else { sx = lx - 14; sy = ly + lh * 0.45; ex = tx + 20; ey = ty - 18; cx = (sx + ex) / 2 + 20; cy = Math.min(sy, ey) - 110; }
      path.setAttribute("d", `M${sx} ${sy} Q${cx} ${cy} ${ex} ${ey}`);
      const ang = Math.atan2(ey - cy, ex - cx), s = 14;
      head.setAttribute("d", `M${ex - s * Math.cos(ang - 0.5)} ${ey - s * Math.sin(ang - 0.5)} L${ex} ${ey} L${ex - s * Math.cos(ang + 0.5)} ${ey - s * Math.sin(ang + 0.5)}`);
      path.style.setProperty("--len", Math.ceil(path.getTotalLength()) + 2); head.style.setProperty("--len", 40);
    }
    const img = photo.querySelector("img");
    (img.complete ? Promise.resolve() : new Promise((r) => (img.onload = r))).then(drawArrow);
    document.fonts.ready.then(drawArrow);
    addEventListener("resize", drawArrow);
    new IntersectionObserver(([e], o) => { if (e.isIntersecting) { drawArrow(); grid.classList.add("play"); o.disconnect(); } }, { threshold: 0.45 }).observe(grid);

    // Fusion recording: plays once when it scrolls into view, then rests on its last frame
    const vid = document.getElementById("cad-video");
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches)
      new IntersectionObserver(([e], o) => { if (e.isIntersecting) { vid.play().catch(() => {}); o.disconnect(); } }, { threshold: 0.6 }).observe(vid);
  </script>
</body>
</html>
